<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾宾浩斯复习计划表</title>
<meta name="description" content="输入要背的总量和开始日期，生成每天该新学什么、复习什么的可打印表格。">
<style>
  :root {
    --line: #d7dde5;
    --soft: #f5f7fa;
    --text: #1a1d23;
    --muted: #6b7684;
    --accent: #2563eb;
    --warn: #c2410c;
  }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text); max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

  /* 表单 */
  .form { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end;
          padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
  .f { display: flex; flex-direction: column; gap: 4px; }
  .f label { font-size: 12px; color: var(--muted); }
  .f input, .f select {
    font: inherit; font-size: 15px; padding: 7px 10px; min-height: 38px;
    border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--text);
    width: 150px;
  }
  .f input[type="number"] { width: 110px; }
  button {
    font: inherit; font-size: 15px; padding: 8px 20px; min-height: 38px;
    border: 1px solid var(--accent); border-radius: 7px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: #fff; color: var(--accent); }
  button:active { transform: translateY(1px); }

  /* 统计 */
  .stats { display: flex; flex-wrap: wrap; gap: 10px 26px; margin: 20px 0;
           padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
  .stats b { font-weight: 600; }
  .stats .k { color: var(--muted); }
  .alert { margin: 0 0 18px; padding: 10px 14px; border-radius: 8px; font-size: 14px;
           background: #fff7ed; border: 1px solid #fed7aa; color: var(--warn); }
  .alert.ok { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }

  /* 表格 */
  #tableWrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 520px; }
  th, td { border: 1px solid var(--line); padding: 7px 10px; vertical-align: top; text-align: left; }
  thead th { background: var(--soft); font-weight: 600; font-size: 13px; position: sticky; top: 0; z-index: 1; }
  td.day { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.num, th.num { white-space: nowrap; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 12px;
         background: #eef2f7; color: #445064; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .rev { margin-bottom: 3px; }
  .rev:last-child { margin-bottom: 0; }
  tr.today { background: #fffbeb; }
  tr.today td.day::after { content: " · 今天"; color: #b45309; font-weight: 600; }
  tr.exam td { background: #eff6ff; font-weight: 600; }
  .empty { color: #b3bcc9; }
  .heavy { color: var(--warn); font-weight: 600; }

  .hint { color: var(--muted); font-size: 12.5px; margin-top: 18px; line-height: 1.8; }
  .hint code { background: var(--soft); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* 打印：去掉控件、表格铺满、表头每页重复 */
  @media print {
    @page { size: A4 portrait; margin: 12mm 10mm; }
    body { max-width: none; padding: 0; font-size: 11pt; }
    .noprint { display: none !important; }
    h1 { font-size: 15pt; }
    .stats { border: none; padding: 0 0 8px; margin: 8px 0 10px; font-size: 9.5pt; gap: 4px 18px; }
    table { font-size: 9pt; min-width: 0; }
    th, td { padding: 4px 6px; border-color: #999; }
    thead th { position: static; background: #eee; }
    tr { page-break-inside: avoid; }
    thead { display: table-header-group; }
    tr.today td.day::after { content: ""; }
    tr.today, tr.exam { background: none; }
    .hint { font-size: 8.5pt; }
  }
</style>
</head>
<body>

<h1>艾宾浩斯复习计划表</h1>
<p class="sub">输入要背的总量和开始日期，生成每天该新学哪一段、该复习哪几段。</p>

<div class="form noprint">
  <div class="f">
    <label for="total">总共要背多少</label>
    <input type="number" id="total" min="1" value="1000">
  </div>
  <div class="f">
    <label for="perDay">每天新学多少</label>
    <input type="number" id="perDay" min="1" value="50">
  </div>
  <div class="f">
    <label for="start">开始日期</label>
    <input type="date" id="start">
  </div>
  <div class="f">
    <label for="exam">考试日期（可不填）</label>
    <input type="date" id="exam">
  </div>
  <div class="f">
    <label for="preset">复习间隔</label>
    <select id="preset">
      <option value="1,2,4,7,15">经典 1·2·4·7·15</option>
      <option value="1,2,4,7,15,30">加强 1·2·4·7·15·30</option>
      <option value="1,3,7,15">宽松 1·3·7·15</option>
      <option value="1,3,7">速成 1·3·7</option>
    </select>
  </div>
  <button id="btnBuild">生成计划</button>
  <button class="ghost" id="btnPrint">导出 PDF</button>
</div>

<div id="alert"></div>
<div id="stats" class="stats" style="display:none"></div>
<div id="tableWrap"></div>

<p class="hint">
  <b>怎么用：</b>照表执行，早上先做「复习」再做「新学」——复习是抢在遗忘前加固，比新学更急。<br>
  <b>为什么要复习这么多次：</b>学完 20 分钟就忘掉约 42%，1 天后忘 74%。前几次间隔短是为了接住最陡的遗忘段，之后间隔逐步拉长，因为每次成功回忆都在加固记忆。<br>
  <b>编号说明：</b>「第 1–50 个」按你实际材料切分，单词表就按词表顺序，书就按页数折算。<br>
  <b>导出 PDF：</b>点「导出 PDF」后在浏览器打印窗口里选「另存为 PDF」。表格已按 A4 排好，表头每页重复。
</p>

<script>
(function () {
  'use strict';

  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // 从 <input type="date"> 的字符串构造本地日期（避免 new Date(str) 按 UTC 解析导致差一天）
  function parseDate(v) {
    var p = v.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function addDays(dt, n) {
    var d = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
    d.setDate(d.getDate() + n);
    return d;
  }
  function startOfDay(dt) {
    return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  }
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function fmtDate(dt) {
    return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()) + ' ' + WD[dt.getDay()];
  }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  function today() { return startOfDay(new Date()); }

  // 默认开始日期 = 今天
  (function init() {
    var t = today();
    $('start').value = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
    build();
  })();

  function build() {
    var total = parseInt($('total').value, 10);
    var perDay = parseInt($('perDay').value, 10);
    var startStr = $('start').value;
    var examStr = $('exam').value;
    var offsets = $('preset').value.split(',').map(Number);

    var alertBox = $('alert');
    var statsBox = $('stats');
    var wrap = $('tableWrap');

    if (!startStr) { alertBox.innerHTML = '<div class="alert">先选个开始日期</div>'; wrap.innerHTML = ''; statsBox.style.display = 'none'; return; }
    if (!(total > 0) || !(perDay > 0)) { alertBox.innerHTML = '<div class="alert">总量和每天新学都得是正数</div>'; wrap.innerHTML = ''; statsBox.style.display = 'none'; return; }
    if (perDay > total) perDay = total;

    var start = parseDate(startStr);
    var exam = examStr ? parseDate(examStr) : null;

    // 批次：第 i 批在开始后第 i 天学，覆盖 [i*perDay+1, min((i+1)*perDay, total)]
    var batchCount = Math.ceil(total / perDay);
    function batchRange(i) {
      var a = i * perDay + 1;
      var b = Math.min((i + 1) * perDay, total);
      return [a, b];
    }

    var maxOffset = Math.max.apply(null, offsets);
    var lastDay = (batchCount - 1) + maxOffset;   // 从第 0 天算起

    // 逐日汇总
    var rows = [];
    var peak = { items: 0, dayIdx: 0 };
    var totalReviewCount = 0;

    for (var d = 0; d <= lastDay; d++) {
      var date = addDays(start, d);
      var nw = (d < batchCount) ? batchRange(d) : null;
      var revs = [];
      for (var k = 0; k < offsets.length; k++) {
        var src = d - offsets[k];
        if (src >= 0 && src < batchCount) {
          var r = batchRange(src);
          revs.push({ off: offsets[k], a: r[0], b: r[1], n: r[1] - r[0] + 1 });
        }
      }
      var items = (nw ? nw[1] - nw[0] + 1 : 0);
      for (var j = 0; j < revs.length; j++) items += revs[j].n;
      totalReviewCount += revs.length;

      if (items > peak.items) peak = { items: items, dayIdx: d };
      rows.push({ d: d, date: date, nw: nw, revs: revs, items: items, isExam: exam && sameDay(date, exam) });
    }

    // 渲染表格
    var html = '<table><thead><tr>'
      + '<th style="width:118px">日期</th>'
      + '<th style="width:104px">新学</th>'
      + '<th>复习（括号里是距那批内容学过几天）</th>'
      + '<th style="width:64px">合计</th>'
      + '</tr></thead><tbody>';

    var t = today();
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var cls = [];
      if (sameDay(r.date, t)) cls.push('today');
      if (r.isExam) cls.push('exam');
      html += '<tr' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>';

      html += '<td class="day">' + fmtDate(r.date) + '</td>';

      html += '<td class="num">' + (r.nw
        ? '第 ' + r.nw[0] + '–' + r.nw[1] + ' 个'
        : '<span class="empty">—</span>') + '</td>';

      html += '<td>';
      if (r.revs.length) {
        for (var q = 0; q < r.revs.length; q++) {
          var rv = r.revs[q];
          html += '<div class="rev"><span class="tag">+' + rv.off + '天</span>第 ' + rv.a + '–' + rv.b + ' 个</div>';
        }
      } else {
        html += '<span class="empty">—</span>';
      }
      html += '</td>';

      html += '<td class="num' + (r.items >= peak.items && r.items > 0 ? ' heavy' : '') + '">' + r.items + '</td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;

    // 统计
    var learnEnd = addDays(start, batchCount - 1);
    var allEnd = addDays(start, lastDay);

    var s = '';
    s += '<div><span class="k">学习期</span> <b>' + batchCount + ' 天</b>（' + fmtDate(start).slice(0, 10) + ' → ' + fmtDate(learnEnd).slice(0, 10) + '）</div>';
    s += '<div><span class="k">最后一轮复习</span> <b>' + fmtDate(allEnd) + '</b>，全程 <b>' + (lastDay + 1) + ' 天</b></div>';
    s += '<div><span class="k">单日最重</span> <b class="heavy">' + peak.items + ' 个</b>（第 ' + (peak.dayIdx + 1) + ' 天 · ' + fmtDate(addDays(start, peak.dayIdx)).slice(0, 10) + '）</div>';
    s += '<div><span class="k">复习总次数</span> <b>' + totalReviewCount + ' 次</b></div>';
    statsBox.innerHTML = s;
    statsBox.style.display = 'flex';

    // 考试日期提示
    var msg = '';
    var msgCls = '';
    if (exam) {
      var toExam = Math.round((startOfDay(exam) - startOfDay(start)) / 86400000);  // 考试是第几天（0 起）
      if (toExam < 0) {
        msg = '考试日期在开始日期之前，检查一下。';
      } else {
        // 学习期是否来得及
        var learnDaysNeeded = batchCount;
        var lastBatchDay = batchCount - 1;
        var doneRounds = 0;
        for (var k2 = 0; k2 < offsets.length; k2++) {
          if (lastBatchDay + offsets[k2] <= toExam) doneRounds++; else break;
        }
        var parts = [];
        if (toExam + 1 < learnDaysNeeded) {
          var needPerDay = Math.ceil(total / (toExam + 1));
          parts.push('按每天 ' + perDay + ' 个要 ' + learnDaysNeeded + ' 天才学完，考试只剩 ' + (toExam + 1) + ' 天——来不及。要赶上，每天得学 <b>' + needPerDay + ' 个</b>。');
        } else {
          parts.push('每天 ' + perDay + ' 个，' + learnDaysNeeded + ' 天学完，考试前还有 ' + (toExam + 1 - learnDaysNeeded) + ' 天空余。');
        }
        if (doneRounds >= offsets.length) {
          parts.push('考试前能完成全部 ' + offsets.length + ' 轮复习，节奏刚好。');
          msgCls = 'ok';
        } else {
          parts.push('但考试前只能复习到第 <b>' + doneRounds + ' 轮</b>（+' + offsets[doneRounds] + ' 天那轮会落在考试后）。想多复习一轮，就提前几天开始。');
        }
        msg = parts.join(' ');
      }
    }
    if (msg) {
      alertBox.innerHTML = '<div class="alert' + (msgCls === 'ok' ? ' ok' : '') + '">' + msg + '</div>';
    } else {
      alertBox.innerHTML = '';
    }
  }

  $('btnBuild').addEventListener('click', build);
  $('btnPrint').addEventListener('click', function () { window.print(); });
  // 改任何输入就重算，省一次点击
  ['total', 'perDay', 'start', 'exam', 'preset'].forEach(function (id) {
    $(id).addEventListener('change', build);
  });
})();
</script>
</body>
</html>
