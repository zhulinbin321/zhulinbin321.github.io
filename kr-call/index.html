<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#0b0d10">
<title>📞 来电｜大韩民国总统 邀请你视频通话</title>
<meta property="og:title" content="📞 大韩民国总统邀请你视频通话">
<meta property="og:description" content="青瓦台来电，请接听。（娱乐整蛊页面）">
<meta property="og:type" content="website">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
  color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
#app{position:fixed;inset:0;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.active{display:flex}

/* ============ 来电界面 ============ */
#incoming{
  align-items:center;justify-content:space-between;
  background:#05070a;overflow:hidden;
}
#incoming .blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.42;mix-blend-mode:screen}
.b1{width:70vw;height:70vw;background:#1f6feb;top:-18vh;left:-18vw;animation:float1 11s ease-in-out infinite}
.b2{width:60vw;height:60vw;background:#0aa;bottom:-16vh;right:-16vw;animation:float2 13s ease-in-out infinite}
.b3{width:50vw;height:50vw;background:#8b3dff;top:38%;left:30%;animation:float1 9s ease-in-out infinite reverse}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,5vh) scale(1.15)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7vw,-6vh) scale(1.1)}}
#incoming::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}

.top{position:relative;z-index:2;width:100%;padding:calc(env(safe-area-inset-top) + 14px) 20px 0;text-align:center}
.caller-label{font-size:12px;letter-spacing:.22em;color:rgba(255,255,255,.6)}
.caller-label .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#07c160;margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.caller-sub{margin-top:8px;font-size:12px;color:rgba(255,255,255,.38)}

.mid{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px}
.avatar-wrap{position:relative}
.avatar{
  width:112px;height:112px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 6px rgba(255,255,255,.08),0 12px 40px rgba(0,0,0,.5);
  animation:breathe 2.6s ease-in-out infinite;overflow:hidden;
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.avatar svg{width:100%;height:100%}
.halo{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(255,255,255,.35);animation:halo 2.2s ease-out infinite}
.halo.d2{animation-delay:1.1s}
@keyframes halo{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.caller-name{font-size:23px;font-weight:600;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.caller-desc{font-size:13px;color:rgba(255,255,255,.55);text-align:center;line-height:1.6}

.bottom{position:relative;z-index:2;width:100%;padding:0 26px calc(env(safe-area-inset-bottom) + 30px)}
.acts{display:flex;justify-content:space-between;align-items:flex-end;padding:0 12px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:rgba(255,255,255,.5);font-size:11px;font-family:inherit}
.act .btn{
  width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.45);transition:transform .12s;
}
.act:active .btn{transform:scale(.9)}
.act .btn.reject{background:#fa5151}
.act .btn.accept{background:#07c160}
.act .btn svg{width:30px;height:30px;fill:#fff}
.act.accept .btn{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(7,193,96,.55)}50%{box-shadow:0 0 0 16px rgba(7,193,96,0)}}
.acts-tip{margin-top:16px;text-align:center;font-size:11px;color:rgba(255,255,255,.3)}

/* ============ 通话界面 ============ */
#calling{background:#000}
.stage{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(130% 80% at 50% 0%, #33415f 0%, #1a2135 45%, #0b0f18 100%);
}
.stage .window{
  position:absolute;top:6%;left:8%;width:38%;height:34%;border-radius:6px;
  background:repeating-linear-gradient(180deg,rgba(190,214,255,.16) 0 7px,rgba(10,14,22,.5) 7px 16px);
  box-shadow:0 0 60px rgba(150,190,255,.12) inset;
}
.stage .shelf{position:absolute;top:12%;right:6%;width:30%;height:26%;
  background:repeating-linear-gradient(180deg,rgba(120,140,180,.10) 0 3px,transparent 3px 26px);
  border-left:2px solid rgba(255,255,255,.05);border-bottom:2px solid rgba(255,255,255,.05);}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:32%;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 100%)}
.stage .person{
  position:absolute;left:50%;bottom:16%;transform:translateX(-50%);
  width:62%;max-width:320px;animation:sway 6s ease-in-out infinite;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.6));
}
@keyframes sway{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.015) rotate(.4deg)}}
.vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 40%,rgba(0,0,0,.65) 100%)}
.scanlines{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.stage.glitch{animation:glitch .18s steps(2) infinite}
@keyframes glitch{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}100%{transform:translate(0,0)}}
.stage.glitch .person{filter:blur(1.2px) contrast(1.3)}
.stage.badnet .person{filter:blur(4px)}
.mosaic{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.10) 0% 25%, rgba(0,0,0,.18) 0% 50%) 0 0/14px 14px}
.stage.badnet .mosaic{opacity:1}

.call-top{position:relative;z-index:3;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;
  display:flex;align-items:center;gap:10px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.call-top .back{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.call-top .who{flex:1;text-align:center;font-size:15px;font-weight:600}
.call-top .timer{font-size:12px;color:rgba(255,255,255,.7);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.net-tag{position:relative;z-index:3;align-self:center;margin-top:8px;
  font-size:11px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.32);
  padding:4px 10px;border-radius:20px;backdrop-filter:blur(6px)}
.net-tag.bad{color:#ffb02e}

.subtitle-box{position:relative;z-index:3;margin:0 18px;min-height:76px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.line{font-size:16px;line-height:1.5;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.85)}
.line .who-tag{display:block;font-size:11px;margin-bottom:4px;opacity:.65}
.line.me{color:#8fe3b0}
.wave{display:flex;gap:3px;justify-content:center;height:14px;align-items:flex-end;opacity:0}
.wave.on{opacity:.9}
.wave i{width:3px;background:#fff;border-radius:2px;height:4px;animation:wv .6s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}
.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.15s}
@keyframes wv{0%,100%{height:4px}50%{height:13px}}

.call-bottom{position:relative;z-index:3;margin-top:auto;padding:0 20px calc(env(safe-area-inset-bottom) + 26px)}
.ctrl{display:flex;justify-content:space-around;align-items:center}
.ctrl button{width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.ctrl button svg{width:26px;height:26px;fill:#fff}
.ctrl button.hang{background:#fa5151;width:64px;height:64px}
.ctrl button.hang svg{width:30px;height:30px}
.ctrl button.off{background:rgba(255,255,255,.34)}
.self-view{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 100px);
  width:92px;height:130px;border-radius:10px;overflow:hidden;background:#101418;
  border:1px solid rgba(255,255,255,.14);z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.self-view video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.self-view .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;font-size:10px;color:rgba(255,255,255,.45);text-align:center;padding:6px}
.self-view .ph svg{width:24px;height:24px;fill:rgba(255,255,255,.35)}

/* ============ 结束页 ============ */
#ended{align-items:center;justify-content:center;background:#05070a;padding:24px;text-align:center}
#ended .card{width:100%;max-width:340px}
#ended .e-icon{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:rgba(250,81,81,.16);
  display:flex;align-items:center;justify-content:center}
#ended .e-icon svg{width:30px;height:30px;fill:#fa5151}
#ended h1{font-size:20px;font-weight:600;margin-bottom:8px}
#ended .meta{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:22px}
.reveal{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:16px;text-align:left;font-size:14px;line-height:1.75;color:rgba(255,255,255,.9)}
.reveal .r-title{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.1em;margin-bottom:8px}
.reveal .r-big{color:#ffd479;font-weight:600}
.disclaim{margin-top:14px;font-size:11px;color:rgba(255,255,255,.32);line-height:1.6}
.share-box{margin-top:22px;display:flex;gap:8px}
.share-box input{flex:1;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:#fff;padding:0 12px;font-size:14px;font-family:inherit;outline:none}
.share-box input::placeholder{color:rgba(255,255,255,.35)}
.btns{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.btns button{height:46px;border-radius:12px;border:0;font-size:15px;font-family:inherit;font-weight:600}
.btn-primary{background:#07c160;color:#fff}
.btn-ghost{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.btns button:active{opacity:.8}

/* ============ 提示层 ============ */
#tapHint{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.35);backdrop-filter:blur(2px)}
#tapHint.on{display:flex}
#tapHint .t{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.16);border-radius:14px;
  padding:14px 20px;font-size:13px;color:rgba(255,255,255,.9);text-align:center;line-height:1.6}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:100;
  background:rgba(0,0,0,.72);border-radius:10px;padding:10px 16px;font-size:13px;
  color:#fff;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">

  <!-- 来电 -->
  <section id="incoming" class="view active">
    <div class="blobs"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

      <div class="caller-label"><span class="dot"></span>正在呼入视频通话</div>

    </div>
    <div class="mid">

        <span class="halo"></span><span class="halo d2"></span>
        <div class="avatar">

            <defs><clipPath id="cp"><circle cx="60" cy="60" r="60"/></clipPath></defs>
            <g clip-path="url(#cp)">
              <rect width="120" height="120" fill="#f2f4f7"/>
              <!-- 西装肩线剪影 -->
              <path d="M60 72c-16 0-27 10-30 26l-4 22h68l-4-22c-3-16-14-26-30-26z" fill="#2b3446"/>
              <path d="M57 74l3 8 3-8-3-3z" fill="#e9edf5"/>
              <path d="M55 82l5 14 5-14-5-4z" fill="#c0392b"/>

              <circle cx="60" cy="52" r="17" fill="#3b4557"/>
              <path d="M43 50c0-11 8-18 17-18s17 7 17 18c0-3-6-6-17-6s-17 3-17 6z" fill="#20272f"/>
              <!-- 太极徽章 -->
              <g transform="translate(88,30) scale(0.42)">
                <circle cx="0" cy="0" r="24" fill="#fff" stroke="#d0d5dd" stroke-width="1"/>
                <path d="M0,-24 A24,24 0 0,1 0,24 A12,12 0 0,1 0,0 A12,12 0 0,0 0,-24 Z" fill="#cd2e3a"/>
                <path d="M0,24 A24,24 0 0,1 0,-24 A12,12 0 0,1 0,0 A12,12 0 0,0 0,24 Z" fill="#0047a0"/>
                <circle cx="0" cy="-11" r="3.6" fill="#0047a0"/>
                <circle cx="0" cy="11" r="3.6" fill="#cd2e3a"/>
              </g>
            </g>
          </svg>
        </div>
      </div>
      <div>
        <div class="caller-name">대한민국 대통령</div>
        <div class="caller-desc">大韩民国总统室 · 邀请你进行视频通话<br><span id="calleeTag"></span></div>
      </div>
    </div>
    <div class="bottom">
      <div class="acts">
        <button class="act" id="btnReject">
          <span class="btn reject">
            <svg viewBox="0 0 24 24"><path d="M6.2 4.8L4.8 6.2 10.6 12l-5.8 5.8 1.4 1.4L12 13.4l5.8 5.8 1.4-1.4L13.4 12l5.8-5.8-1.4-1.4L12 10.6z"/></svg>
          </span>
          <span>拒绝</span>
        </button>
        <button class="act accept" id="btnAccept">
          <span class="btn accept">
            <svg viewBox="0 0 24 24"><path d="M4 6h9a1 1 0 0 1 1 1v1.6l5.4-3.2A1 1 0 0 1 21 6.3v11.4a1 1 0 0 1-1.6.8L14 15.4V17a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/></svg>
          </span>
          <span>接听</span>
        </button>
      </div>
      <div class="acts-tip">本页面为娱乐整蛊效果，与任何真实人物、机构无关</div>
    </div>
  </section>

  <!-- 通话中 -->
  <section id="calling" class="view">
    <div class="stage" id="stage">
      <div class="window"></div><div class="shelf"></div><div class="floor"></div>
      <svg class="person" viewBox="0 0 200 220" aria-hidden="true">
        <ellipse cx="100" cy="212" rx="72" ry="10" fill="rgba(0,0,0,.35)"/>
        <path d="M100 96c-30 0-50 18-56 52l-6 44h124l-6-44c-6-34-26-52-56-52z" fill="#1c2436"/>
        <path d="M100 96c-30 0-50 18-56 52l-2 16c8-26 28-40 58-40s50 14 58 40l-2-16c-6-34-26-52-56-52z" fill="#26304a"/>
        <path d="M92 98l8 22 8-22-8-6z" fill="#e7ebf2"/>
        <path d="M86 122l14 40 14-40-14-10z" fill="#b5322a"/>
        <circle cx="100" cy="66" r="34" fill="#2a3348"/>
        <path d="M66 62c0-23 15-36 34-36s34 13 34 36c2-8-12-14-34-14s-36 6-34 14z" fill="#161b26"/>
        <path d="M88 66h5v7h-5zM107 66h5v7h-5z" fill="#0e1218" opacity=".7"/>
        <path d="M92 84c5 4 11 4 16 0" stroke="#0e1218" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6"/>
      </svg>
      <div class="vignette"></div><div class="mosaic"></div><div class="scanlines"></div>
    </div>

    <div class="call-top">
      <div class="back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="rgba(255,255,255,.85)"><path d="M15.4 4.6L8 12l7.4 7.4 1.4-1.4L10.8 12l6-6z"/></svg>
      </div>
      <div class="who">대한민국 대통령</div>
      <div class="timer" id="callTimer">00:00</div>
    </div>
    <div class="net-tag" id="netTag">🇰🇷 首尔 · 网络良好 · 延迟 28ms</div>

    <div style="flex:1"></div>

    <div class="subtitle-box">
      <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="line" id="subLine"></div>
    </div>

    <div class="self-view" id="selfView">
      <video id="selfVideo" playsinline autoplay muted></video>
      <div class="ph" id="selfPh">
        <svg viewBox="0 0 24 24"><path d="M4 6h9a1 1 0 0 1 1 1v1.6l5.4-3.2A1 1 0 0 1 21 6.3v11.4a1 1 0 0 1-1.6.8L14 15.4V17a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/></svg>
        <span>你的摄像头<br>未开启</span>
      </div>
    </div>

    <div class="call-bottom">
      <div class="ctrl">
        <button id="btnMute" title="静音">
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg>
        </button>
        <button id="btnHang" class="hang">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" transform="rotate(135 12 12)"/></svg>
        </button>
        <button id="btnSpeaker" title="免提">
          <svg viewBox="0 0 24 24"><path d="M5 9v6h4l5 5V4L9 9H5zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- 结束 -->
  <section id="ended" class="view">
    <div class="card">
      <div class="e-icon">
        <svg viewBox="0 0 24 24"><path d="M4.8 4.8L2.4 7.2 9.6 14.4 6 18l2.4 2.4 3.6-3.6 7.2 7.2 2.4-2.4z"/></svg>
      </div>
      <h1 id="endTitle">通话已结束</h1>
      <div class="meta" id="endMeta">通话时长 00:00 · 通话质量：较差</div>
      <div class="reveal" id="endReveal"></div>
      <div class="disclaim">本页面纯属虚构，仅用于朋友间娱乐整蛊，与任何真实人物、机构无关。</div>
      <div class="share-box">
        <input id="friendName" type="text" placeholder="输入朋友的名字" maxlength="12">
        <button class="btn-primary" style="height:44px;border-radius:10px;padding:0 14px" id="btnGen">转发给他</button>
      </div>
      <div class="btns">
        <button class="btn-primary" id="btnAgain">再接一次</button>
        <button class="btn-ghost" id="btnCopySelf">复制本页面链接</button>
      </div>
    </div>
  </section>

  <div id="tapHint"><div class="t">🔔 有来电<br><span style="opacity:.7">轻触屏幕开启铃声</span></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 参数 ---------- */
  function getParam(key){
    var m = location.search.match(new RegExp('[?&]' + key + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  var rawName = getParam('n').trim();
  var NAME = rawName.replace(/[<>"'&]/g, '').slice(0, 12) || '这位中国朋友';
  document.getElementById('calleeTag').textContent = rawName ? ('呼叫：' + NAME) : '未知号码 · 国际来电';

  var $ = function(id){ return document.getElementById(id); };
  var views = { incoming: $('incoming'), calling: $('calling'), ended: $('ended') };
  function show(name){
    for (var k in views){
      if (k === name) views[k].classList.add('active');
      else views[k].classList.remove('active');
    }
  }

  /* ---------- 时钟 ---------- */
  var d = new Date();
  $('incomingTime').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ' · 国际来电';

  /* ---------- 音频（Web Audio 合成，无外部文件） ---------- */
  var ctx = null, master = null;
  function ensureAudio(){
    if (!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.55;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended'){ try { ctx.resume(); } catch(e){} }
    return ctx.state === 'running';
  }
  function tone(freq, dur, type, gain, when){
    if (!ctx) return;
    var t = (when == null) ? ctx.currentTime : when;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.012);
    g.gain.setTargetAtTime(0.0001, t + dur * 0.55, dur * 0.3);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.5);
  }
  function connectTone(){
    if (!ensureAudio()) return;
    var base = ctx.currentTime + 0.05;
    tone(523.25, 0.12, 'sine', 0.22, base);
    tone(659.25, 0.12, 'sine', 0.22, base + 0.11);
    tone(783.99, 0.22, 'sine', 0.20, base + 0.22);
  }
  function hangupTone(){
    if (!ensureAudio()) return;
    var base = ctx.currentTime + 0.02;
    tone(659.25, 0.14, 'sine', 0.20, base);
    tone(523.25, 0.14, 'sine', 0.20, base + 0.13);
    tone(392.00, 0.30, 'sine', 0.16, base + 0.26);
  }
  // 说话时的含糊语音（低音量，模拟对方在讲话）
  function mumble(dur){
    if (!ctx || ctx.state !== 'running') return;
    var n = Math.max(1, Math.round(dur / 0.19));
    for (var i = 0; i < n; i++){
      var t = ctx.currentTime + 0.05 + i * 0.19;
      var o = ctx.createOscillator(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(105 + Math.random() * 55, t);
      o.frequency.linearRampToValueAtTime(88 + Math.random() * 35, t + 0.14);
      bp.type = 'bandpass'; bp.frequency.value = 520 + Math.random() * 340; bp.Q.value = 1.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.045, t + 0.03);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.16);
      o.connect(bp); bp.connect(g); g.connect(master);
      o.start(t); o.stop(t + 0.18);
    }
  }

  // 微信风来电铃声：两声上行短音 + 停顿，循环
  var RING_PERIOD = 1.72;
  var RING_SEQ = [
    { off: 0.00, f: 659.25, d: 0.15 },
    { off: 0.18, f: 783.99, d: 0.15 },
    { off: 0.64, f: 659.25, d: 0.15 },
    { off: 0.82, f: 783.99, d: 0.15 }
  ];
  var ringing = false, ringTimer = null, nextRingAt = 0, vibTimer = null;
  function scheduleRing(){
    if (!ringing || !ctx) return;
    var now = ctx.currentTime;
    if (nextRingAt < now) nextRingAt = now + 0.05;
    while (nextRingAt < now + 1.0){
      for (var i = 0; i < RING_SEQ.length; i++){
        var s = RING_SEQ[i], base = nextRingAt + s.off;
        tone(s.f, s.d, 'triangle', 0.20, base);
        tone(s.f * 2, s.d, 'sine', 0.045, base + 0.02);
        tone(s.f, s.d * 0.8, 'sine', 0.06, base + 0.05);
      }
      nextRingAt += RING_PERIOD;
    }
    ringTimer = setTimeout(scheduleRing, 400);
  }
  function startRing(){
    if (!ensureAudio()) return false;
    ringing = true;
    nextRingAt = ctx.currentTime + 0.05;
    scheduleRing();
    if (navigator.vibrate && !vibTimer){
      var vib = function(){ navigator.vibrate([700, 350, 700, 900]); };
      vib(); vibTimer = setInterval(vib, 2650);
    }
    return true;
  }
  function stopRing(){
    ringing = false;
    if (ringTimer){ clearTimeout(ringTimer); ringTimer = null; }
    if (vibTimer){ clearInterval(vibTimer); vibTimer = null; }
    if (navigator.vibrate) try { navigator.vibrate(0); } catch(e){}
  }

  /* ---------- 首个手势解锁音频 ---------- */
  var hint = $('tapHint');
  function tryAutoStart(){
    if (ringing) return;
    if (startRing()) hint.classList.remove('on');
    else hint.classList.add('on');
  }
  hint.addEventListener('click', function(){
    hint.classList.remove('on');
    if (!ringing) startRing();
  });
  document.addEventListener('touchstart', function once(){
    if (hint.classList.contains('on')){ hint.classList.remove('on'); }
    if (!ringing) startRing();
    document.removeEventListener('touchstart', once);
  }, { passive: true });
  window.addEventListener('load', tryAutoStart);
  tryAutoStart();

  /* ---------- 字幕/剧本 ---------- */
  var timers = [], typeTimers = [], callSec = 0, callTick = null, muted = false, rejected = 0;
  function clearTimers(){
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    for (var j = 0; j < typeTimers.length; j++) clearInterval(typeTimers[j]);
    timers = []; typeTimers = [];
  }
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  var subLine = $('subLine'), wave = $('wave');
  function say(who, text, dur){
    var tag = who === 'me' ? '你' : '对方';
    subLine.className = 'line' + (who === 'me' ? ' me' : '');
    subLine.innerHTML = '';
    var t = document.createElement('span');
    t.className = 'who-tag'; t.textContent = tag;
    var b = document.createElement('span');
    subLine.appendChild(t); subLine.appendChild(b);
    var i = 0, step = Math.max(28, Math.min(70, dur * 1000 / Math.max(6, text.length)));
    var typeTimer = setInterval(function(){
      b.textContent = text.slice(0, ++i);
      if (i >= text.length) clearInterval(typeTimer);
    }, step);
    typeTimers.push(typeTimer);
    wave.classList.add('on');
    if (!muted && who !== 'me') mumble(dur * 0.85);
    later(function(){ wave.classList.remove('on'); }, dur * 1000);
  }

  var netTag = $('netTag'), stage = $('stage');
  function glitch(ms, bad){
    stage.classList.add(bad ? 'badnet' : 'glitch');
    netTag.classList.add('bad');
    netTag.textContent = bad ? '⚠️ 网络连接不稳定…' : '⚠️ 画面卡顿中…';
    later(function(){
      stage.classList.remove('glitch', 'badnet');
      netTag.classList.remove('bad');
      netTag.textContent = '🇰🇷 首尔 · 网络良好 · 延迟 28ms';
    }, ms);
  }

  function startTimer(){
    callSec = 0;
    $('callTimer').textContent = '00:00';
    callTick = setInterval(function(){
      callSec++;
      var m = ('0' + Math.floor(callSec / 60)).slice(-2), s = ('0' + (callSec % 60)).slice(-2);
      $('callTimer').textContent = m + ':' + s;
    }, 1000);
  }
  function fmtSec(){ var m = ('0' + Math.floor(callSec / 60)).slice(-2), s = ('0' + (callSec % 60)).slice(-2); return m + ':' + s; }

  /* ---------- 摄像头小窗 ---------- */
  function openSelfCam(){
    var v = $('selfVideo');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(function(stream){ v.srcObject = stream; $('selfPh').style.display = 'none'; })
      .catch(function(){ /* 降级：保留占位 */ });
  }

  /* ---------- 通话流程 ---------- */
  function accept(){
    stopRing();
    ensureAudio();
    connectTone();
    show('calling');
    startTimer();
    openSelfCam();
    later(function(){ say('other', '喂？……喂——听得到吗？', 2.2); }, 900);
    later(function(){ say('other', '请问是 ' + NAME + ' 吗？', 2.4); }, 3400);
    later(function(){ say('other', '这里是青瓦台。我是大韩民国总统。', 2.9); }, 6200);
    later(function(){ say('other', '别紧张，不是什么坏事。', 2.0); }, 9500);
    later(function(){ say('other', '我们内阁开了整整三天的会……', 2.4); }, 11800);
    later(function(){ say('other', '决定把第 21 任「荣誉泡菜品鉴官」', 2.6); }, 14500);
    later(function(){ say('other', '……授予给你。', 1.8); }, 17400);
    later(function(){ say('other', '这是很高的荣誉，全国只有三个人拿到过。', 3.0); glitch(1400); }, 19500);
    later(function(){ say('me', '（你沉默了）', 2.0); }, 22800);
    later(function(){ say('other', '喂？喂？信号不好吗？', 2.2); glitch(1600); }, 25200);
    later(function(){ say('other', '其实还有一件事，就是那个……', 2.4); }, 27800);
    later(function(){ glitch(2200, true); subLine.textContent = ''; }, 30500);
    later(function(){ finish('network'); }, 33200);
  }

  function endCall(kind){
    clearTimers();
    if (callTick){ clearInterval(callTick); callTick = null; }
    stopRing();
    hangupTone();
    var v = $('selfVideo');
    if (v.srcObject){ v.srcObject.getTracks().forEach(function(t){ t.stop(); }); v.srcObject = null; $('selfPh').style.display = 'flex'; }
    subLine.textContent = ''; wave.classList.remove('on');
    finish(kind);
  }

  function finish(kind){
    show('ended');
    var title = $('endTitle'), meta = $('endMeta'), reveal = $('endReveal');
    if (kind === 'reject3'){
      title.textContent = '他不再打了';
      meta.textContent = '未接来电 3 次 · 已拒接';
      reveal.innerHTML = '';
      var a = document.createElement('div');
      a.className = 'r-title'; a.textContent = '他发来一条消息';
      var b = document.createElement('div');
      b.className = 'r-big';
      b.textContent = '「我懂了。」';
      var c = document.createElement('div');
      c.style.marginTop = '8px';
      c.textContent = '（三个小时后又发来一句：「真的只是想聊聊泡菜。」）';
      reveal.appendChild(a); reveal.appendChild(b); reveal.appendChild(c);
      return;
    }
    title.textContent = '通话已结束';
    meta.textContent = '通话时长 ' + fmtSec() + ' · 通话质量：较差';
    reveal.innerHTML = '';
    var t1 = document.createElement('div'); t1.className = 'r-title'; t1.textContent = '他最后没说完的那句话';
    var t2 = document.createElement('div'); t2.className = 'r-big';
    t2.textContent = '「……能不能先借我 5000 韩元打车费。」';
    var t3 = document.createElement('div'); t3.style.marginTop = '8px';
    t3.textContent = '（折合人民币约 27 块。你挂断了。）';
    reveal.appendChild(t1); reveal.appendChild(t2); reveal.appendChild(t3);
  }

  /* ---------- 拒绝 & 重拨 ---------- */
  function reject(){
    rejected++;
    stopRing();
    hangupTone();
    if (rejected >= 3){ finish('reject3'); return; }
    toast('已拒绝 · 对方正在重新呼叫…');
    later(function(){
      show('incoming');
      startRing();
      toast('');
    }, 1800);
  }

  var toastEl = $('toast'), toastTimer = null;
  function toast(msg){
    if (!msg){ toastEl.classList.remove('on'); return; }
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 2000);
  }

  /* ---------- 交互 ---------- */
  $('btnAccept').addEventListener('click', accept);
  $('btnReject').addEventListener('click', reject);
  $('btnHang').addEventListener('click', function(){ endCall('manual'); });
  $('btnMute').addEventListener('click', function(){
    muted = !muted;
    if (muted) this.classList.add('off'); else this.classList.remove('off');
    toast(muted ? '已静音' : '已取消静音');
  });
  $('btnSpeaker').addEventListener('click', function(){
    this.classList.toggle('off');
    toast(this.classList.contains('off') ? '已开启免提' : '已关闭免提');
  });
  $('btnAgain').addEventListener('click', function(){
    location.href = location.pathname + (rawName ? ('?n=' + encodeURIComponent(rawName)) : '');
  });

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('链接已复制，去 QQ 粘贴给他'); }, fallback);
    } else fallback();
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('链接已复制，去 QQ 粘贴给他'); }
      catch(e){ toast('复制失败，请长按地址栏复制'); }
      document.body.removeChild(ta);
    }
  }
  $('btnGen').addEventListener('click', function(){
    var n = $('friendName').value.trim().replace(/[<>"'&]/g, '').slice(0, 12);
    var url = location.origin + location.pathname + (n ? ('?n=' + encodeURIComponent(n)) : '');
    copyText(url);
  });
  $('btnCopySelf').addEventListener('click', function(){ copyText(location.href); });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden && ringing) stopRing();
    else if (!document.hidden && views.incoming.classList.contains('active')) startRing();
  });
})();
</script>
</body>
